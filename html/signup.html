
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | SpaceBook</title>
    <link rel="stylesheet" href="../css/signup.css">
</head>
<body>

    <div class="signup-container">

        <div class="signup-left">
            <h1>SpaceBook</h1>
            <h2>Find your space.<br>Focus on your work.</h2>
            <p>Discover and book the perfect workspace for your needs.</p>
        </div>

        <div class="signup-right">
            <form id="signupForm">

                <h2>Create Account</h2>
                <p class="subtitle">Join SpaceBook today!</p>

                <label for="fullName">Full Name</label>
                <input type="text" id="fullName"
                       placeholder="Enter your full name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email"
                       placeholder="Enter your email" required>

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone"
                       placeholder="Enter your phone number"
                       pattern="[0-9]{10}" required>

                <label for="password">Password</label>
                <div class="password-box">
                    <input type="password" id="password"
                           placeholder="Create a password" required>
                    <button type="button" class="toggle-password"
                            data-target="password">Show</button>
                </div>

                <label for="confirmPassword">Confirm Password</label>
                <div class="password-box">
                    <input type="password" id="confirmPassword"
                           placeholder="Confirm your password" required>
                    <button type="button" class="toggle-password"
                            data-target="confirmPassword">Show</button>
                </div>

                <p id="errorMessage"></p>

                <button type="submit" class="signup-btn">
                    Create Account
                </button>

                <p class="login-link">
                    Already have an account?
                    <a href="login.html">Login</a>
                </p>

            </form>
        </div>

    </div>

    <script src="../js/signup.js"></script>
</body>
</html>
